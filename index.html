<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Henry Barrios Thornhill · Data Analyst</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080c10;
      --surface: #0f1419;
      --border: #1e2730;
      --accent: #00d4aa;
      --accent2: #f0a500;
      --text: #e8edf2;
      --muted: #6b7a8d;
      --card: #111820;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* Custom cursor */
    .cursor {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transition: transform 0.1s ease;
    }
    .cursor-ring {
      width: 32px; height: 32px;
      border: 1px solid rgba(0,212,170,0.4);
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      transition: all 0.2s ease;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 2px; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: 0.5; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    .fade-up { animation: fadeUp 0.8s ease forwards; }
    .slide-in { animation: slideIn 0.6s ease forwards; }

    .delay-1 { animation-delay: 0.1s; opacity: 0; }
    .delay-2 { animation-delay: 0.2s; opacity: 0; }
    .delay-3 { animation-delay: 0.3s; opacity: 0; }
    .delay-4 { animation-delay: 0.4s; opacity: 0; }
    .delay-5 { animation-delay: 0.5s; opacity: 0; }
    .delay-6 { animation-delay: 0.6s; opacity: 0; }
    .delay-7 { animation-delay: 0.7s; opacity: 0; }
    .delay-8 { animation-delay: 0.8s; opacity: 0; }

    .cursor-blink { animation: blink 1s step-end infinite; }
    .float-anim { animation: float 4s ease-in-out infinite; }

    /* Section transitions */
    .section-reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .section-reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Nav */
    nav { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

    /* Accent line */
    .accent-line {
      width: 40px; height: 2px;
      background: var(--accent);
      display: inline-block;
      margin-bottom: 4px;
      vertical-align: middle;
      margin-right: 12px;
    }

    /* Cards */
    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .project-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.3s ease;
    }
    .project-card:hover::before { transform: scaleX(1); }
    .project-card:hover {
      border-color: rgba(0,212,170,0.2);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    /* Skill pill */
    .skill-pill {
      background: rgba(0,212,170,0.06);
      border: 1px solid rgba(0,212,170,0.15);
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 2px;
      transition: all 0.2s ease;
      display: inline-block;
    }
    .skill-pill:hover {
      background: rgba(0,212,170,0.12);
      border-color: rgba(0,212,170,0.4);
    }

    /* Timeline */
    .timeline-item {
      border-left: 1px solid var(--border);
      padding-left: 24px;
      position: relative;
    }
    .timeline-item::before {
      content: '';
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      position: absolute;
      left: -4.5px;
      top: 6px;
      box-shadow: 0 0 0 0 rgba(0,212,170,0.5);
      animation: pulse-ring 2s ease-out infinite;
    }
    .timeline-item:not(:last-child) { margin-bottom: 40px; }

    /* Hero grid bg */
    .grid-bg {
      background-image:
        linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* Glow orbs */
    .orb {
      border-radius: 50%;
      filter: blur(80px);
      position: absolute;
      pointer-events: none;
    }

    /* Section header */
    .section-num {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.2em;
    }

    /* Nav link */
    .nav-link {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s ease;
      position: relative;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 0; height: 1px;
      background: var(--accent);
      transition: width 0.3s ease;
    }
    .nav-link:hover { color: var(--accent); }
    .nav-link:hover::after { width: 100%; }

    /* Scanline effect for hero */
    .scanline {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(transparent, rgba(0,212,170,0.05), transparent);
      animation: scanline 6s linear infinite;
      pointer-events: none;
    }

    /* Tag */
    .lang-tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0.05em;
    }

    /* Section divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
      margin: 0;
    }

    /* Btn */
    .btn-primary {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      padding: 10px 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      padding: 10px 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }
    .btn-ghost:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    /* Experience card */
    .exp-card {
      background: var(--card);
      border: 1px solid var(--border);
      transition: border-color 0.3s ease;
    }
    .exp-card:hover { border-color: rgba(0,212,170,0.15); }

    /* Mobile cursor hide */
    @media (max-width: 768px) {
      body { cursor: auto; }
      .cursor, .cursor-ring { display: none; }
    }

    /* DM Serif for display */
    .display-font { font-family: 'DM Serif Display', serif; }
    .mono-font { font-family: 'DM Mono', monospace; }
  </style>
</head>

function Nav() {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);

  return (
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
      background: scrolled ? 'rgba(8,12,16,0.92)' : 'transparent',

      transition: 'all 0.3s ease',

function Hero() {
  const [typed, setTyped] = useState('');
  const roles = ['Data Analyst', 'BI Developer', 'Python · SQL · Power BI'];
  const [ri, setRi] = useState(0);

  useEffect(() => {
    let i = 0, current = roles[ri], timeout;
    const type = () => {
      if (i <= current.length) {
        setTyped(current.slice(0, i));
        i++;
        timeout = setTimeout(type, 80);
      } else {
        timeout = setTimeout(() => {
          let del = current.length;
          const erase = () => {
            if (del >= 0) {
              setTyped(current.slice(0, del));
              del--;
              timeout = setTimeout(erase, 40);
            } else {
              setRi(p => (p + 1) % roles.length);
            }
          };
          erase();
        }, 2000);
      }
    };
    type();
    return () => clearTimeout(timeout);
  }, [ri]);

  return (
    <section style={{minHeight: '100vh', display: 'flex', alignItems: 'center', position: 'relative', overflow: 'hidden'}} className="grid-bg">
      {/* Orbs */}
      <div className="orb" style={{width: 500, height: 500, background: 'rgba(0,212,170,0.06)', top: -100, right: -150}} />

      <div style={{maxWidth: 1100, margin: '0 auto', padding: '120px 32px 80px', position: 'relative', zIndex: 1, width: '100%'}}>

            <p className="mono-font fade-up delay-1" style={{fontSize: '0.75rem', color: 'var(--accent)', letterSpacing: '0.25em', marginBottom: 20}}>
              DISPONIBLE · LAS PALMAS, ES
            </p>
            <h1 className="display-font fade-up delay-2" style={{fontSize: 'clamp(3rem, 6vw, 5.5rem)', lineHeight: 1.05, marginBottom: 16, color: 'var(--text)'}}>
              Henry<br/>
              <span style={{fontStyle: 'italic', color: 'var(--muted)'}}>Barrios</span><br/>
              Thornhill
            </h1>
            <div className="fade-up delay-3" style={{height: 2, width: 60, background: 'linear-gradient(90deg,var(--accent),var(--accent2))', marginBottom: 24}} />
            <div className="mono-font fade-up delay-4" style={{fontSize: '1.1rem', color: 'var(--accent)', marginBottom: 24, minHeight: 32}}>
              {typed}<span className="cursor-blink" style={{borderRight: '2px solid var(--accent)', marginLeft: 2}}>&nbsp;</span>
            </div>
            <p className="fade-up delay-5" style={{color: 'var(--muted)', lineHeight: 1.75, maxWidth: 520, fontSize: '0.95rem', marginBottom: 40}}>
              {DATA.bio}
            </p>
            <div className="fade-up delay-6" style={{display: 'flex', gap: 16, flexWrap: 'wrap'}}>
              <a href={DATA.github} target="_blank" rel="noopener noreferrer" className="btn-primary">
                → GitHub
              </a>
              <a href="#proyectos" className="btn-ghost">Ver proyectos</a>
              <a href="#contacto" className="btn-ghost">Contacto</a>
            </div>

          {/* Stats box */}

            background: 'rgba(15,20,25,0.8)',
            padding: '32px 28px',

/* ── CURSOR ── */
function Cursor() {
  const dot = useRef(null);
  const ring = useRef(null);

  useEffect(() => {
    const move = (e) => {
      if (dot.current) {
        dot.current.style.left = e.clientX - 4 + 'px';
        dot.current.style.top = e.clientY - 4 + 'px';
      }
      if (ring.current) {
        ring.current.style.left = e.clientX - 16 + 'px';
        ring.current.style.top = e.clientY - 16 + 'px';
      }
    };
    window.addEventListener('mousemove', move);
    return () => window.removeEventListener('mousemove', move);
  }, []);

  return (
    <>
      <div className="cursor" ref={dot} />
      <div className="cursor-ring" ref={ring} />
    </>
  );
}

/* ── SCROLL REVEAL ── */
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.section-reveal');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => entry.target.classList.add('visible'), i * 80);
        }
      });
    }, { threshold: 0.1 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

}
