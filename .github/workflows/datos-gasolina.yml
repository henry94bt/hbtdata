# Regenera hbtdata.es/datos/ con los precios del día del Ministerio y lo sube a main
# (Hostinger publica cada push a main). Si la API falla, no se sube nada y la web
# sigue con los precios del último día, que llevan su fecha.
name: Datos · gasolina

on:
  schedule:
    - cron: '23 7 * * *'    # 07:23 UTC: 7:23 en Canarias en invierno, 8:23 en verano
    - cron: '41 12 * * *'   # repesca: solo hace algo si a esa hora aún no están los precios de hoy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-gasolina
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar precios y rehacer las páginas
        run: |
          if [ "${{ github.event.schedule }}" = "41 12 * * *" ]; then
            python3 _taller/datos/generar.py --si-falta
          else
            python3 _taller/datos/generar.py
          fi

      - name: Subir a main
        run: |
          git config user.name 'hbtdata-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Datos: gasolina del $(TZ=Atlantic/Canary date +%d/%m/%Y)"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
